[package]
name = "panopticon-linux-agent"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Linux endpoint telemetry and constrained response agent for Panopticon"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
