name: Bug report
description: Report a defect in the Linux agent or isolation helper
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not use this template to report a security vulnerability -- see
        [SECURITY.md](https://github.com/Panopticon-Co/panopticon-linux-agent/blob/main/SECURITY.md)
        and report privately via GitHub Security Advisories instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands, configuration, or test invocation.
      placeholder: |
        1. cmake -S . -B build -G Ninja ...
        2. cmake --build build
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Distro/kernel version, compiler and version, CMake version, whether this is a portable/sanitizer build.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      render: shell
  - type: textarea
    id: additional
    attributes:
      label: Additional context
