name: Deprecated Rust prototype check
# Retained only to keep the discontinued prototype buildable while the C++20 rebaseline is
# prepared. It is not evidence of Linux-agent functionality or a release gate.
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo test --all-targets
